server:
  forward-headers-strategy: native

logging:
  structured:
    format:
      console: ecs

app:
  cookies:
    secure: ${APP_COOKIES_SECURE:true}
  jwt:
    staff-secret: ${APP_JWT_STAFF_SECRET}
    customer-secret: ${APP_JWT_CUSTOMER_SECRET}
  otp:
    secret: ${APP_OTP_SECRET}
  media:
    dir: ${APP_MEDIA_DIR}
    serve: false
  sms:
    provider: ${APP_SMS_PROVIDER:logging}
    kavenegar:
      api-key: ${APP_SMS_KAVENEGAR_API_KEY:}
      base-url: ${APP_SMS_KAVENEGAR_BASE_URL:https://api.kavenegar.com}
      templates:
        otp: ${APP_SMS_KAVENEGAR_TEMPLATE_OTP:pws-otp}
        order-paid: ${APP_SMS_KAVENEGAR_TEMPLATE_ORDER_PAID:pws-order-paid}
        order-approved: ${APP_SMS_KAVENEGAR_TEMPLATE_ORDER_APPROVED:pws-order-approved}
        order-shipped: ${APP_SMS_KAVENEGAR_TEMPLATE_ORDER_SHIPPED:pws-order-shipped}
  bootstrap:
    owner:
      username: ${APP_BOOTSTRAP_OWNER_USERNAME}
      password: ${APP_BOOTSTRAP_OWNER_PASSWORD}
      mobile: ${APP_BOOTSTRAP_OWNER_MOBILE}
  zarinpal:
    merchant-id: ${APP_ZARINPAL_MERCHANT_ID:sandbox-merchant-id-0123456789}
    sandbox: ${APP_ZARINPAL_SANDBOX:true}
    callback-url: ${APP_ZARINPAL_CALLBACK_URL:http://localhost:8080/api/shop/payments/zarinpal/callback}
