spring:
  flyway:
    out-of-order: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

management:
  endpoints:
    web:
      exposure:
        include: health

# Dev/test defaults. application-prod.yml overrides every secret with an env var and no default.
app:
  cookies:
    secure: false
  jwt:
    staff-secret: dev-staff-secret-change-me-0123456789abcdef
    customer-secret: dev-customer-secret-change-me-0123456789abcdef
  otp:
    secret: dev-otp-secret-change-me-0123456789abcdef
  media:
    dir: ${user.dir}/.media
    base-url: /media
    serve: true
  sms:
    provider: logging
    kavenegar:
      api-key: dev-kavenegar-api-key
      base-url: https://api.kavenegar.com
      templates:
        otp: pws-otp
        order-paid: pws-order-paid
        order-approved: pws-order-approved
        order-shipped: pws-order-shipped
  bootstrap:
    owner:
      username: owner
      password: Ali1384ali
      mobile: "09136978682"
  payment:
    active-gateway: TABAPAY
  tabapay:
    merchant-id: dev-tabapay-merchant-id-0123456789
    sandbox: true
    callback-url: http://localhost:8080/api/shop/payments/callback
  zarinpal:
    merchant-id: dev-zarinpal-merchant-id-0123456789
    sandbox: true
    callback-url: http://localhost:8080/api/shop/payments/zarinpal/callback
