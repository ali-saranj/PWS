services:
  postgres:
    image: postgres:16-alpine
    container_name: pws-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pws}
      POSTGRES_USER: ${POSTGRES_USER:-pws}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pws_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pws} -d ${POSTGRES_DB:-pws}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 384M

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: pws-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx512m -XX:+UseSerialGC"
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-pws}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-pws}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      APP_JWT_STAFF_SECRET: ${APP_JWT_STAFF_SECRET}
      APP_JWT_CUSTOMER_SECRET: ${APP_JWT_CUSTOMER_SECRET}
      APP_OTP_SECRET: ${APP_OTP_SECRET}
      APP_COOKIES_SECURE: ${APP_COOKIES_SECURE:-true}
      APP_MEDIA_DIR: /media
      APP_SMS_PROVIDER: ${APP_SMS_PROVIDER:-logging}
      APP_SMS_KAVENEGAR_API_KEY: ${APP_SMS_KAVENEGAR_API_KEY:-}
      APP_SMS_KAVENEGAR_BASE_URL: ${APP_SMS_KAVENEGAR_BASE_URL:-https://api.kavenegar.com}
      APP_SMS_KAVENEGAR_TEMPLATE_OTP: ${APP_SMS_KAVENEGAR_TEMPLATE_OTP:-pws-otp}
      APP_SMS_KAVENEGAR_TEMPLATE_ORDER_PAID: ${APP_SMS_KAVENEGAR_TEMPLATE_ORDER_PAID:-pws-order-paid}
      APP_SMS_KAVENEGAR_TEMPLATE_ORDER_APPROVED: ${APP_SMS_KAVENEGAR_TEMPLATE_ORDER_APPROVED:-pws-order-approved}
      APP_SMS_KAVENEGAR_TEMPLATE_ORDER_SHIPPED: ${APP_SMS_KAVENEGAR_TEMPLATE_ORDER_SHIPPED:-pws-order-shipped}
      APP_BOOTSTRAP_OWNER_USERNAME: ${APP_BOOTSTRAP_OWNER_USERNAME:-owner}
      APP_BOOTSTRAP_OWNER_PASSWORD: ${APP_BOOTSTRAP_OWNER_PASSWORD}
      APP_BOOTSTRAP_OWNER_MOBILE: ${APP_BOOTSTRAP_OWNER_MOBILE}
      APP_ZARINPAL_MERCHANT_ID: ${APP_ZARINPAL_MERCHANT_ID:-sandbox-merchant-id-0123456789}
      APP_ZARINPAL_SANDBOX: ${APP_ZARINPAL_SANDBOX:-true}
      APP_ZARINPAL_CALLBACK_URL: ${APP_ZARINPAL_CALLBACK_URL}
    volumes:
      - pws_media:/media
    deploy:
      resources:
        limits:
          memory: 768M

  shop:
    build:
      context: ../shop
      dockerfile: Dockerfile
    container_name: pws-shop
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
      INTERNAL_API_URL: http://api:8080
      API_INTERNAL_URL: http://api:8080/api/:path*
    deploy:
      resources:
        limits:
          memory: 384M

  nginx:
    image: nginx:1.27-alpine
    container_name: pws-nginx
    restart: unless-stopped
    command: "/bin/sh -c 'while :; do sleep 12h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"
    depends_on:
      - shop
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/pws.conf:/etc/nginx/conf.d/default.conf:ro
      - ../admin/dist:/var/www/admin:ro
      - pws_media:/var/www/media:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    deploy:
      resources:
        limits:
          memory: 128M

  certbot:
    image: certbot/certbot:v3.1.0
    container_name: pws-certbot
    restart: unless-stopped
    volumes:
      - certbot_www:/var/www/certbot:rw
      - certbot_conf:/etc/letsencrypt:rw
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  pws_pgdata:
  pws_media:
  certbot_www:
  certbot_conf:
