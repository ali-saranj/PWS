# Nginx Reverse Proxy Configuration for Persian Web Store (PWS)
# Upstreams: Next.js Storefront (3000) & Spring Boot Core API (8080)

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

server {
    listen 80;
    listen [::]:80;
    server_name proteinirany.ir www.proteinirany.ir localhost 94.184.25.112;

    client_max_body_size 10M;

    # Let's Encrypt / Certbot verification challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Enamad verification challenge file
    location = /13642013.txt {
        default_type text/plain;
        return 200 "";
    }

    # Staff Admin SPA
    location = /admin {
        return 301 /admin/;
    }

    location /admin/assets/ {
        alias /var/www/admin/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /admin/ {
        alias /var/www/admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # Product media assets (persistent volume)
    location /media/ {
        alias /var/www/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Core API Actuator Health Endpoint
    location = /api/actuator/health {
        proxy_pass http://api:8080/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Core API Endpoints
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js Storefront Static Assets
    location /_next/static/ {
        proxy_pass http://shop:3000/_next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Customer Storefront SSR
    location / {
        proxy_pass http://shop:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
