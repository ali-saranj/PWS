# Nginx Reverse Proxy Configuration for Persian Web Store (PWS)
# Upstreams: Next.js Storefront (3000) & Spring Boot Core API (8080)

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

# ==============================================================================
# 1. HTTP Server Block (Port 80)
# Handles ACME challenge & Enamad verification; 301 redirects all else to HTTPS
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name proteinirany.ir www.proteinirany.ir localhost 94.184.25.112;

    client_max_body_size 10M;

    # Let's Encrypt / Certbot verification challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Enamad verification challenge file
    location = /13642013.txt {
        default_type text/plain;
        return 200 "";
    }

    # Google Search Console verification challenge file
    location = /google872ff9ecc4073d7e.html {
        default_type text/html;
        return 200 "google-site-verification: google872ff9ecc4073d7e.html\n";
    }

    # Permanent redirect to canonical HTTPS domain
    location / {
        return 301 https://proteinirany.ir$request_uri;
    }
}

# ==============================================================================
# 2. HTTPS Non-Canonical Redirection Block (Port 443)
# Redirects www.proteinirany.ir to canonical https://proteinirany.ir
# ==============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.proteinirany.ir;

    ssl_certificate /etc/letsencrypt/live/proteinirany.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/proteinirany.ir/privkey.pem;

    return 301 https://proteinirany.ir$request_uri;
}

# ==============================================================================
# 3. HTTPS Canonical Server Block (Port 443)
# Primary reverse proxy gateway for proteinirany.ir
# ==============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name proteinirany.ir;

    client_max_body_size 10M;

    # Let's Encrypt certificates
    ssl_certificate /etc/letsencrypt/live/proteinirany.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/proteinirany.ir/privkey.pem;

    # Mozilla Intermediate TLS configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Enamad verification challenge file
    location = /13642013.txt {
        default_type text/plain;
        return 200 "";
    }

    # Google Search Console verification challenge file
    location = /google872ff9ecc4073d7e.html {
        default_type text/html;
        return 200 "google-site-verification: google872ff9ecc4073d7e.html\n";
    }

    # Staff Admin SPA
    location = /admin {
        return 301 /admin/;
    }

    location /admin/assets/ {
        alias /var/www/admin/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /admin/ {
        alias /var/www/admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # Product media assets (persistent volume)
    location /media/ {
        alias /var/www/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Core API Actuator Health Endpoint
    location = /api/actuator/health {
        proxy_pass http://api:8080/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }

    # Core API Endpoints
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }

    # Next.js Storefront Static Assets
    location /_next/static/ {
        proxy_pass http://shop:3000/_next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Customer Storefront SSR
    location / {
        proxy_pass http://shop:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_cache_bypass $http_upgrade;
    }
}
